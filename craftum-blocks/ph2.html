<!-- Craftum HTML-блок: ph2. Самодостаточный: стили внутри, префикс .bt- -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.bt{--g:#07090e;--gt:#101522;--p:#10141c;--a:#ff951f;--v:#edcd8c;--i:#f4f5f7;--im:#c9ced8;--l:#303139;
--lg:#f3f1ec;--lp:#fff;--li:#14171f;--lim:#4a4f5b;--ll:#dcd8cf;
font-family:"IBM Plex Sans",sans-serif;font-size:16px;line-height:1.6;color:var(--i);background:var(--g);box-sizing:border-box}
.bt *,.bt *::before,.bt *::after{box-sizing:inherit}
.bt-w{max-width:1200px;margin:0 auto;padding:0 32px}
.bt-sec{padding:96px 0}
.bt-dark{background:var(--g);color:var(--i)} .bt-tint{background:var(--gt);color:var(--i)}
.bt-light{background:var(--lg);color:var(--li)}
.bt h1,.bt h2,.bt h3{font-weight:500;letter-spacing:-.02em;line-height:1.08;margin:0 0 16px}
.bt h2{font-size:clamp(30px,3.6vw,46px)} .bt h3{font-size:20px;line-height:1.25}
.bt p{margin:0 0 14px;line-height:1.65}
.bt-dark p,.bt-tint p{color:var(--im)} .bt-light p{color:var(--lim)}
.bt-k{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--a);margin-bottom:14px;display:block}
.bt-light .bt-k{color:#b45f00}
.bt-btn{display:inline-flex;gap:10px;align-items:center;background:var(--a);color:#0b0c10;font-weight:600;text-decoration:none;padding:14px 26px;border-radius:40px;border:1px solid var(--a);transition:background 160ms ease,border-color 160ms ease}
.bt-btn:hover{background:#ffad52;border-color:#ffad52}
.bt-btn2{display:inline-flex;gap:10px;align-items:center;color:inherit;text-decoration:none;padding:14px 26px;border-radius:40px;border:1px solid currentColor;transition:background 160ms ease}
.bt-btn2:hover{background:rgba(127,127,127,.15)}
.bt a:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.bt-acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.bt img{max-width:100%;height:auto;display:block}
.bt-grid3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l);border-left:1px solid var(--l)}
.bt-light .bt-grid3{border-color:var(--ll)}
.bt-cell{padding:30px;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:var(--p)}
.bt-light .bt-cell{background:var(--lp);border-color:var(--ll)}
.bt-ic{width:36px;height:36px;border:1px solid var(--v);border-radius:5px;display:grid;place-items:center;color:var(--v);font-family:"IBM Plex Mono",monospace;font-size:13px;margin-bottom:18px}
.bt-light .bt-ic{border-color:#b45f00;color:#b45f00}
.bt-cell a{color:var(--a);font-weight:500;text-decoration:none}.bt-light .bt-cell a{color:#a35500}
.bt-split{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:start}
.bt-list{list-style:none;padding:0;margin:0}
.bt-list li{padding:14px 0 14px 28px;border-top:1px solid var(--l);position:relative}
.bt-light .bt-list li{border-color:var(--ll)}
.bt-list li::before{content:"";position:absolute;left:0;top:24px;width:12px;height:1px;background:var(--a)}
@media (max-width:1100px){.bt-sec{padding:72px 0}.bt-split{gap:32px}}
@media (max-width:800px){.bt-split{grid-template-columns:1fr}.bt-grid3{grid-template-columns:1fr 1fr}.bt-w{padding:0 20px}}
@media (max-width:520px){.bt-grid3{grid-template-columns:1fr}.bt-sec{padding:56px 0}.bt-btn,.bt-btn2{width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){.bt *{transition:none!important}}
.bt-ph2 .bt-w{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}.bt-ph2 img{border-radius:4px;width:100%;aspect-ratio:16/10;object-fit:cover}
@media (max-width:800px){.bt-ph2 .bt-w{grid-template-columns:1fr}}</style>
<section class="bt bt-sec bt-light bt-ph2"><div class="bt-w"><img src="https://ztim2008.github.io/baltur-tashkent/img/g4.webp" alt="Инженер сервисного центра в котельной" width="1600" height="1000" loading="lazy"><div><span class="bt-k">Оснащение</span><h2>Инженеры и оборудование</h2><p>У каждой бригады — газоанализатор, манометры, набор для обслуживания и ходовые запчасти в машине. Это позволяет закрыть большинство вызовов за один выезд.</p><p>После каждой работы инженер оставляет акт и протокол замеров дымовых газов.</p><div class="bt-acts"><a class="bt-btn" href="tel:+998982100303">Позвонить: +998 98 210 03 03 <span aria-hidden="true">→</span></a></div></div></div></section>
