<!-- Craftum HTML-блок: gorelki-baltur-01-bt-hero. Самодостаточный: стили внутри, префикс .bt- -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.bt{--g:#07090e;--gt:#101522;--p:#10141c;--a:#ff8a2a;--c:#15803d;--ch:#166534;--v:#edcd8c;--i:#f4f5f7;--im:#c9ced8;--l:#303139;
--lg:#f3f1ec;--lp:#fff;--li:#14171f;--lim:#4a4f5b;--ll:#dcd8cf;
font-family:"IBM Plex Sans",sans-serif;font-size:16px;line-height:1.6;color:var(--i);background:var(--g);box-sizing:border-box}
.bt *,.bt *::before,.bt *::after{box-sizing:inherit}
.bt-w{max-width:1200px;margin:0 auto;padding:0 32px}
.bt-sec{padding:96px 0}
.bt-dark{background:var(--g);color:var(--i)} .bt-tint{background:var(--gt);color:var(--i)}
.bt-light{background:var(--lg);color:var(--li)}
.bt h1,.bt h2,.bt h3{font-weight:500;letter-spacing:-.02em;line-height:1.08;margin:0 0 16px}
.bt h2{font-size:clamp(30px,3.6vw,46px)} .bt h3{font-size:20px;line-height:1.25}
.bt p{margin:0 0 14px;line-height:1.65}
.bt-dark p,.bt-tint p{color:var(--im)} .bt-light p{color:var(--lim)}
.bt-k{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--a);margin-bottom:14px;display:block}
.bt-light .bt-k{color:#b45f00}
.bt-btn{display:inline-flex;gap:10px;align-items:center;background:var(--a);color:#0b0c10;font-weight:600;text-decoration:none;padding:14px 26px;border-radius:40px;border:1px solid var(--a);transition:background 160ms ease,border-color 160ms ease}
.bt-btn:hover{background:#ffad52;border-color:#ffad52}
.bt-call{background:var(--c);border-color:var(--c);color:#fff}.bt-call:hover{background:var(--ch);border-color:var(--ch)}
.bt-acts{display:flex;flex-wrap:wrap;gap:12px}
.bt-fx{position:relative;isolation:isolate;overflow:hidden}
.bt-fx>.bt-w{position:relative;z-index:2}
.bt-fx::before{content:"";position:absolute;inset:0;z-index:0;background:var(--bg,none) center/cover no-repeat;opacity:.55}
.bt-fx::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(7,9,14,.55),rgba(7,9,14,.82))}
.bt-veil{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.85}
.bt-veil-fallback>.bt-w::before{content:"";position:absolute;inset:-96px -100vw;z-index:-1;pointer-events:none;background:radial-gradient(60% 70% at 85% 15%,rgba(120,8,8,.55),transparent 70%),radial-gradient(50% 60% at 10% 90%,rgba(66,0,0,.6),transparent 70%)}
.bt-btn2{display:inline-flex;gap:10px;align-items:center;color:inherit;text-decoration:none;padding:14px 26px;border-radius:40px;border:1px solid currentColor;transition:background 160ms ease}
.bt-btn2:hover{background:rgba(127,127,127,.15)}
.bt a:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.bt-acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.bt img{max-width:100%;height:auto;display:block}
.bt-grid3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l);border-left:1px solid var(--l)}
.bt-light .bt-grid3{border-color:var(--ll)}
.bt-cell{padding:30px;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:var(--p)}
.bt-light .bt-cell{background:var(--lp);border-color:var(--ll)}
.bt-ic{width:36px;height:36px;border:1px solid var(--v);border-radius:5px;display:grid;place-items:center;color:var(--v);font-family:"IBM Plex Mono",monospace;font-size:13px;margin-bottom:18px}
.bt-light .bt-ic{border-color:#b45f00;color:#b45f00}
.bt-cell a{color:var(--a);font-weight:500;text-decoration:none}.bt-light .bt-cell a{color:#a35500}
.bt-split{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:start}
.bt-list{list-style:none;padding:0;margin:0}
.bt-list li{padding:14px 0 14px 28px;border-top:1px solid var(--l);position:relative}
.bt-light .bt-list li{border-color:var(--ll)}
.bt-list li::before{content:"";position:absolute;left:0;top:24px;width:12px;height:1px;background:var(--a)}
@media (max-width:1100px){.bt-sec{padding:72px 0}.bt-split{gap:32px}}
@media (max-width:800px){.bt-split{grid-template-columns:1fr}.bt-grid3{grid-template-columns:1fr 1fr}.bt-w{padding:0 20px}}
@media (max-width:520px){.bt-grid3{grid-template-columns:1fr}.bt-sec{padding:56px 0}.bt-btn,.bt-btn2{width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){.bt *{transition:none!important}}

@property --bt-ga{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --bt-gao{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --bt-gp{syntax:"<percentage>";initial-value:5%;inherits:false}
@property --bt-gs{syntax:"<color>";initial-value:white;inherits:false}
.bt-btn{--sb:var(--a);--sh:#ffd29a;--shs:#fff3e0;--dur:3s;isolation:isolate;position:relative;overflow:hidden;border:1px solid transparent!important;
background:linear-gradient(var(--sb),var(--sb)) padding-box,conic-gradient(from calc(var(--bt-ga) - var(--bt-gao)),transparent,var(--sh) var(--bt-gp),var(--bt-gs) calc(var(--bt-gp)*2),var(--sh) calc(var(--bt-gp)*3),transparent calc(var(--bt-gp)*4)) border-box!important;
transition:--bt-gao 800ms cubic-bezier(.25,1,.5,1),--bt-gp 800ms cubic-bezier(.25,1,.5,1),--bt-gs 800ms cubic-bezier(.25,1,.5,1)!important;
animation:bt-ga var(--dur) linear infinite,bt-ga calc(var(--dur)/.4) linear infinite reverse paused;animation-composition:add}
.bt-btn.bt-call{--sb:var(--c);--sh:#7ee2a2;--shs:#dcfce7}
.bt-btn:hover{--sb:var(--ch)}.bt-btn:not(.bt-call):hover{--sb:#ff9c45}
.bt-btn::before,.bt-btn::after,.bt-btn>.bt-sl::before{content:"";pointer-events:none;position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:-1}
.bt-btn::before{--sz:calc(100% - 6px);width:var(--sz);height:var(--sz);border-radius:inherit;opacity:.35;background:radial-gradient(circle at 2px 2px,#fff .5px,transparent 0) padding-box;background-size:4px 4px;background-repeat:space;
-webkit-mask-image:conic-gradient(from calc(var(--bt-ga) + 45deg),#000,transparent 10% 90%,#000);mask-image:conic-gradient(from calc(var(--bt-ga) + 45deg),#000,transparent 10% 90%,#000);animation:bt-ga var(--dur) linear infinite,bt-ga calc(var(--dur)/.4) linear infinite reverse paused;animation-composition:add}
.bt-btn::after{width:100%;aspect-ratio:1;opacity:.5;background:linear-gradient(-50deg,transparent,var(--sh),transparent);-webkit-mask-image:radial-gradient(circle at bottom,transparent 40%,#000);mask-image:radial-gradient(circle at bottom,transparent 40%,#000);animation:bt-shim var(--dur) linear infinite,bt-shim calc(var(--dur)/.4) linear infinite reverse paused;animation-composition:add}
.bt-btn>.bt-sl{position:relative;z-index:1;display:inline-flex;gap:10px;align-items:center}
.bt-btn>.bt-sl::before{--sz:calc(100% + 2rem);width:var(--sz);height:var(--sz);box-shadow:inset 0 -1ex 2rem 4px var(--sh);opacity:0;transition:opacity 800ms cubic-bezier(.25,1,.5,1);animation:bt-breathe 4.5s linear infinite}
.bt-btn:is(:hover,:focus-visible){--bt-gp:20%;--bt-gao:95deg;--bt-gs:var(--shs);animation-play-state:running}
.bt-btn:is(:hover,:focus-visible)::before,.bt-btn:is(:hover,:focus-visible)::after{animation-play-state:running}
.bt-btn:is(:hover,:focus-visible)>.bt-sl::before{opacity:.6}
.bt-btn:focus-visible{outline:3px solid #fff;outline-offset:4px}.bt-btn:active{translate:0 1px}
@keyframes bt-ga{to{--bt-ga:360deg}}@keyframes bt-shim{to{rotate:360deg}}@keyframes bt-breathe{0%,100%{scale:1}50%{scale:1.2}}
@media (prefers-reduced-motion:reduce){.bt-btn,.bt-btn::before,.bt-btn::after,.bt-btn>.bt-sl::before{animation:none!important;transition:none!important}}
.bt-hero{padding:88px 0 96px;overflow:hidden}.bt-hero .bt-w{display:grid;grid-template-columns:7fr 5fr;gap:56px;align-items:center}
.bt-hero h1{font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.03em}
.bt-hero .bt-lead{font-size:19px;max-width:560px}
.bt-frame{position:relative;margin:24px 24px 0 0}
.bt-frame::before,.bt-frame::after{content:"";position:absolute;inset:0;border:1px solid var(--l);border-radius:5px}
.bt-frame::before{transform:translate(12px,-12px)}.bt-frame::after{transform:translate(24px,-24px);border-color:#24262d}
.bt-obj{position:relative;z-index:1;background:radial-gradient(120% 80% at 70% 0%,rgba(255,149,31,.18),transparent 60%),var(--p);border:1px solid var(--l);border-radius:5px;padding:28px}
.bt-obj img{border-radius:4px;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:75% 50%;margin-bottom:22px;background:#000}
.bt-big{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--v);font-size:56px;line-height:1}
.bt-big small{font-size:16px;color:var(--im);margin-left:6px}
.bt-objrow{display:flex;justify-content:space-between;border-top:1px solid var(--l);padding-top:14px;margin-top:16px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--im)}
@media (max-width:800px){.bt-hero .bt-w{grid-template-columns:1fr}.bt-frame{margin:16px 12px 0 0}.bt-frame::after{display:none}}</style>
<section class="bt bt-sec bt-dark bt-hero bt-fx" data-veil data-veil-color="#420000"><div class="bt-w"><div><span class="bt-k">Оборудование</span><h1>Горелки Baltur: серии, которые мы обслуживаем</h1><p class="bt-lead">Итальянский производитель горелок с 1950 года. Обслуживаем газовые, дизельные, комбинированные и промышленные горелки Baltur в Ташкенте.</p><div class="bt-acts"><a class="bt-btn bt-call" href="tel:+998982100303"><span class="bt-sl">Позвонить: +998 98 210 03 03 <span aria-hidden="true">→</span></span></a></div></div>
<div class="bt-frame"><div class="bt-obj"><img src="https://ztim2008.github.io/baltur-tashkent/img/part.webp" alt="Газовая горелка Baltur с рампой" width="1600" height="900" fetchpriority="high"><div class="bt-big">1950<small>год основания Baltur</small></div><div class="bt-objrow"><span>Ченто, Италия</span><span>60 стран</span></div></div></div></div></section>
